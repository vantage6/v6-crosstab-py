[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "v6-crosstab-py"
version = "1.1.0"
description = "Create a contingency table showing the relationship between two or more variables"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pandas",
  "scipy",
  "vantage6-algorithm-tools>=5.0.1",
]
authors = [
  { name = "Bart van Beusekom", email = "b.vanbeusekom@iknl.nl" },
  { name = "H. Alradhi" },
  { name = "Frank Martin", email = "f.martin@iknl.nl" },
]
license = { text = "MIT" }
keywords = ["vantage6", "algorithm", "federated-learning"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/vantage6/v6-crosstab-py"
Repository = "https://github.com/vantage6/v6-crosstab-py"
Issues = "https://github.com/vantage6/v6-crosstab-py/issues"

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["v6-crosstab-py"]

[dependency-groups]
dev = [
  "pytest",
]
